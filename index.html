<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>出雲驛傳 8 日旅行 App (Vue3 版)</title>
  <!-- 引入 Vue 3 CDN (全域版本，更穩定) -->
  <script src="https://unpkg.com/vue@3.5.43/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #a9c9d3; --panel: #fdf1de; --fg: #4a3a2c; --mut: #8a7560; --card: #fffaf1;
      --ln: #d8c3a2; --ac: #d1624a; --ac2: #2f6272; --soft: #f6dfc2; --yl: #e9b94b;
      --on: #fff; --hf: #23404d; --sky: #eef4fa; --gr: #7a9a55;
      --hw: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --nz: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .32 0 0 0 0 .25 0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
      box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media(prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #24383f; --panel: #2c434b; --fg: #f1e6d3; --mut: #b8a98f; --card: #35505a;
        --ln: #4d6a74; --ac: #ee8a72; --ac2: #8cc3d0; --soft: #3d5964; --on: #2b1f16;
        --hf: #f1e6d3; --sky: #2c4254;
      }
    }
    :root[data-theme="dark"] {
      --bg: #24383f; --panel: #2c434b; --fg: #f1e6d3; --mut: #b8a98f; --card: #35505a;
      --ln: #4d6a74; --ac: #ee8a72; --ac2: #8cc3d0; --soft: #3d5964; --on: #2b1f16;
      --hf: #f1e6d3; --sky: #2c4254;
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--hw); padding-bottom: 84px; }
    body:before { content: ""; position: fixed; inset: 0; background: var(--nz); opacity: .22; mix-blend-mode: multiply; pointer-events: none; z-index: 50; }
    [v-cloak] { display: none !important; } /* 防止 Vue 未渲染前顯示插值圖樣 */
    header { position: relative; padding: 16px 18px; color: var(--hf); background: var(--bg); overflow: hidden; min-height: 120px; border-radius: 0 0 24px 20px/0 0 20px 24px; }
    header h1 { margin: 2px 0 0; font: 800 21px/1.3 var(--hw); letter-spacing: .08em; }
    header p { margin: 8px 0 0; font: 13px/1.5 var(--hw); }
    header svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    header > *:not(svg) { position: relative; z-index: 1; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; scrollbar-width: none; }
    .chip { flex: 0 0 auto; border: 0; background: var(--panel); color: var(--fg); border-radius: 14px 10px 15px 9px/10px 15px 9px 14px; padding: 5px 12px; text-align: center; font: 12px/1.3 var(--hw); cursor: pointer; }
    .chip b { display: block; font-size: 15px; }
    .chip.on { background: var(--yl); color: #4a3a2c; transform: rotate(-2deg); }
    main { background: var(--panel); margin: 0 10px; padding: 12px 12px 14px; max-width: 640px; border-radius: 26px 20px 24px 18px/20px 24px 18px 26px; min-height: 60vh; }
    @media(min-width: 680px) { main { margin: 0 auto; } }
    h2 { font: 700 19px var(--hw); margin: 4px 0 2px; text-decoration: underline wavy var(--ac2) 1.5px; text-underline-offset: 6px; }
    .sub { color: var(--mut); font-size: 13px; margin: 6px 0 10px; }
    .tl { border-left: 2.5px dashed var(--ln); margin: 10px 0 0 6px; padding-left: 15px; }
    .it, .card { position: relative; background: var(--card); border: 1.5px dashed var(--ln); border-radius: 18px 12px 20px 11px/12px 20px 11px 18px; padding: 9px 12px; margin: 0 0 10px; }
    .it:before { content: ""; position: absolute; left: -23px; top: 14px; width: 11px; height: 11px; border-radius: 50% 45% 50% 48%; background: var(--ac); border: 2px solid var(--panel); }
    .tm { font: 15px var(--hw); color: var(--ac); }
    .tt { font-weight: 600; }
    .nt { font-size: 13px; color: var(--mut); white-space: pre-line; }
    .cost { display: inline-block; font: 12.5px var(--hw); background: var(--soft); color: var(--ac); border-radius: 9px 6px 10px 6px; padding: 1px 8px; margin-top: 3px; }
    .btn { display: inline-block; margin: 6px 6px 0 0; background: var(--ac); color: var(--on); text-decoration: none; border-radius: 15px 10px 16px 9px/10px 16px 9px 15px; padding: 4px 13px; font: 14px var(--hw); }
    .btn.r { background: var(--ac2); }
    .est { background: var(--soft); border-radius: 14px 9px 15px 8px; padding: 8px 12px; font: 14px var(--hw); margin: 8px 0 2px; }
    .warn { background: #f9e3a6; color: #5a4410; border-radius: 14px 9px 15px 8px; padding: 8px 12px; font-size: 13px; margin: 8px 0; }
    .card h3 { margin: 0 0 2px; font: 17px var(--hw); }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1.5px dashed var(--ln); font-size: 14px; }
    .row:first-of-type { border-top: 0; }
    .bar { height: 8px; border-radius: 6px 4px 7px 4px; background: var(--ln); margin-top: 3px; }
    .bar i { display: block; height: 100%; border-radius: 6px 4px 7px 4px; background: var(--yl); }
    label { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--ac); flex: 0 0 auto; margin-top: 2px; }
    label.d span { text-decoration: line-through wavy var(--ac); color: var(--mut); }
    nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--panel); border-top: 2.5px dashed var(--ln); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 60; }
    nav button { flex: 1; border: 0; background: none; color: var(--mut); padding: 7px 0 6px; font: 12px var(--hw); cursor: pointer; }
    nav button b { display: block; font-size: 21px; line-height: 1.2; }
    nav button.on { color: var(--ac); }
    nav button.on b { transform: rotate(-8deg); }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <style>
    .ledger label { display:block; cursor:default; }
    .ledger input, .ledger select, .ledger textarea { width:100%; padding:10px; border:1px solid var(--ln); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
    .ledger .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ledger button { cursor:pointer; border:0; min-height:40px; }
    .ledger button:disabled { opacity:.5; cursor:wait; }
    .ledger .message { white-space:pre-line; overflow-wrap:anywhere; }
    .ledger .actions { display:flex; flex-wrap:wrap; gap:6px; }
    @media(max-width:390px) { .ledger .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 頁首 -->
  <header>
    <h1>東京 ‧ 出雲驛傳 ‧ 大阪</h1>
    <p>10/9 – 10/16 ｜ Mifa &amp; Weii</p>
    <svg viewBox="0 0 400 132" preserveAspectRatio="xMaxYMax slice" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="302" cy="64" r="34" fill="#d9a08c" opacity=".92"/>
      <g stroke="#e6f2f6" stroke-width="9" fill="none"><path d="M232 40h44"/><path d="M250 66h74" opacity=".8"/><path d="M360 50h50" opacity=".8"/></g>
      <path d="M150 112Q215 104 262 88 280 76 292 56Q300 48 308 56 322 74 346 90 372 104 410 112Z" fill="#5b8fa4"/>
      <path d="M277 76L292 57Q300 48 308 57L322 74 316 72 313 82 308 73 303 86 298 74 292 84 288 73 283 80Z" fill="#fff"/>
      <g fill="#c25a44"><rect x="340" y="96" width="2.5" height="14"/><rect x="354" y="96" width="2.5" height="14"/><rect x="337" y="94" width="22" height="3"/></g>
      <path d="M364 106L374 97 386 106Z" fill="#2f6272"/><rect x="367" y="106" width="16" height="4" fill="#fdf1de"/>
      <path d="M0 108Q100 100 200 109T400 107V132H0Z" fill="#3d6c80"/>
      <path d="M0 116Q120 108 240 117T400 114V132H0Z" fill="#5b8fa4"/>
      <path d="M0 123Q140 117 260 124T400 121V132H0Z" fill="#80b2c4"/>
      <path d="M0 129Q200 125 400 130V132H0Z" fill="#3d6c80"/>
    </svg>
  </header>
  <!-- 日期 Chips 列 (僅在行程 Tab 顯示) -->
  <div v-if="tab === 0" class="chips">
    <button 
      v-for="(day, idx) in days" 
      :key="idx" 
      class="chip" 
      :class="{ on: cur === idx }"
      @click="setCur(idx)"
    >
      <b>{{ day.d.split(' ')[0] }}</b>{{ day.d.split(' ')[1] }}
    </button>
  </div>
  <!-- 主要內容區 -->
  <main>
    <!-- Tab 0: 行程 -->
    <template v-if="tab === 0">
      <h2>{{ currentDayData.d }}｜{{ currentDayData.t }}</h2>
      <div v-if="currentDayData.w" class="warn">⚠ {{ currentDayData.w }}</div>
      <aside v-if="cur === 2" class="card" style="border:2px solid var(--ac2);margin-top:12px" aria-label="行李寄放位置">
        <h3>🧳 今天的行李寄放位置</h3>
        <p class="nt"><b>首選｜池袋站東口（北）PARCO 前</b><br>JR 北改札外 →「いけふくろう」貓頭鷹雕像附近 → 階梯後方置物櫃室。<br>有 L 型櫃；06:00–22:00。櫃位未預約，空位與尺寸請現場／查詢頁確認。</p>
        <a class="btn r" href="https://media.jreast.co.jp/articles/5026" target="_blank" rel="noopener">📍 官方位置圖</a>
        <a class="btn" href="https://multiecube.com/station/35" target="_blank" rel="noopener">🧳 空位／預約</a>
        <p class="nt"><b>備案｜Sunshine City B1 地下通道／alpa B1 広小路</b><br>一般 08:00–22:00；大型 ¥1,000，約高 86.8 × 寬 35.5 × 深 64.5 cm，部分櫃位尺寸不同。</p>
        <a class="btn r" href="https://sunshinecity.jp/information/guide.html" target="_blank" rel="noopener">📍 商場櫃位／樓層圖</a>
        <div class="est">取件提醒：13:00 離開商場；寄商場先取、寄車站回站再取。13:30 前搭車去羽田。拍下櫃號、位置並保留取件憑證。</div>
        <div class="est">取件提醒：13:10 離開商場；寄商場先取、寄車站回站再取。13:40 左右搭車去羽田。拍下櫃號、位置並保留取件憑證。</div>
      </aside>
      <div class="tl">
        <div v-for="(item, idx) in currentDayData.i" :key="idx" class="it">
          <div class="tm">{{ item[0] }}</div>
          <div class="tt">{{ item[1] }}</div>
          <div v-if="item[2]" class="nt">{{ item[2] }}</div>
          <span v-if="item[4]" class="cost">{{ item[4] }}</span>
          <br v-if="item[4]">
          
          <!-- 按鈕連結區 -->
          <template v-if="item[3]">
            <template v-if="Array.isArray(item[3])">
              <a v-for="(b, bi) in item[3]" :key="bi" class="btn" :class="b[2]" target="_blank" rel="noopener" :href="getMapUrl(b[1])">{{ b[0] }}</a>
            </template>
            <template v-else>
              <a class="btn" :class="{ r: isHttp(item[3]) }" target="_blank" rel="noopener" :href="getMapUrl(item[3])">
                {{ isHttp(item[3]) ? '🧭 路線導航' : '📍 導航' }}
              </a>
            </template>
          </template>
        </div>
      </div>
      <div class="est">💴 當日預估花費（未預付，兩人）：約 ¥{{ currentDayData.e.toLocaleString() }}</div>
    </template>
    <!-- Tab 1: 交通 -->
    <template v-else-if="tab === 1">
      <h2>🚆 交通</h2>
      <p class="sub">票價為估計值（每人），請以 Google Map 即時確認</p>
      <div v-for="(row, idx) in transports" :key="idx" class="card">
        <div class="nt">{{ row[0] }}</div>
        <h3>{{ row[1] }}</h3>
        <div class="nt">{{ row[2] }} ｜ {{ row[3] }} ｜ {{ row[4] }}</div>
        <a v-if="row[5]" class="btn r" target="_blank" rel="noopener" :href="getMapUrl(row[5])">🧭 路線導航</a>
      </div>
    </template>
    <!-- Tab 2: 住宿 -->
    <template v-else-if="tab === 2">
      <h2>🏨 住宿</h2>
      <p class="sub">精確地址請看訂房確認信</p>
      <div v-for="(row, idx) in hotels" :key="idx" class="card">
        <div class="nt">{{ row[0] }}</div>
        <h3>{{ row[1] }}</h3>
        <div class="nt">{{ row[2] }}</div>
        <a v-if="row[3]" class="btn" target="_blank" rel="noopener" :href="getMapUrl(row[3])">📍 導航</a>
      </div>
    </template>
    <!-- Tab 3: 行李 -->
    <template v-else-if="tab === 3">
      <h2>🎒 行李清單</h2>
      <p class="sub">勾選會存在這支手機的瀏覽器</p>
      <div v-for="(group, gi) in packing" :key="gi" class="card">
        <h3>{{ group[0] }}</h3>
        <label v-for="(item, ii) in group.slice(1)" :key="ii" :class="{ d: pk[gi + '-' + ii] }">
          <input type="checkbox" v-model="pk[gi + '-' + ii]">
          <span>{{ item }}</span>
        </label>
      </div>
    </template>
    <!-- Tab 4: 預算 -->
    <template v-else-if="tab === 4">
      <h2>💰 預算</h2>
      <section class="ledger" aria-label="雲端記帳">
        <div class="card">
          <h3>☁️ 雲端記帳</h3>
          <p class="sub">原有預算保留在下方。實際支出獨立記錄，不會自動重複加入預付費用。</p>
          <p v-if="cloudError" class="warn message" role="alert">{{ cloudError }}</p>
          <p class="sub message" role="status" aria-live="polite">{{ cloudStatus }}</p>
          <form v-if="!cloudUser" @submit.prevent="signIn">
            <label>Email<input v-model.trim="login.email" type="email" autocomplete="username" required></label>
            <label>密碼<input v-model="login.password" type="password" autocomplete="current-password" required></label>
            <button class="btn" :disabled="authBusy || !cloudAvailable">{{ authBusy ? '登入中…' : '登入' }}</button>
            <p class="sub">使用已建立且授權的 Supabase 帳號登入。</p>
          </form>
          <template v-else>
            <p>登入：{{ memberName || cloudUser.email }}</p>
            <div class="actions">
              <button class="btn r" @click="refreshExpenses" :disabled="loading || busy || !memberReady">重新同步</button>
              <button class="btn" @click="signOut" :disabled="busy || authBusy">登出</button>
            </div>
          </template>
        </div>
        <template v-if="cloudUser && memberReady">
          <div class="card">
            <h3>已記錄支出（依原幣別）</h3>
            <div class="row"><span>日幣 JPY</span><b>{{ money(totals.JPY, 'JPY') }}</b></div>
            <div class="row"><span>台幣 TWD</span><b>{{ money(totals.TWD, 'TWD') }}</b></div>
            <p class="sub">不換匯、不合併兩種幣別。刷卡已知台幣金額時，選 TWD；日幣原價可記在備註，避免同一筆重複入帳。</p>
          </div>
          <div class="card">
            <h3>{{ editing ? '編輯支出' : '新增支出' }}</h3>
            <form @submit.prevent="saveExpense">
              <fieldset :disabled="busy" style="border:0;padding:0;margin:0">
                <div class="grid">
                  <label>日期<input v-model="expenseForm.expense_date" type="date" required></label>
                  <label>分類<select v-model="expenseForm.category"><option v-for="c in categories" :key="c">{{ c }}</option></select></label>
                </div>
                <label>項目<input v-model.trim="expenseForm.description" maxlength="200" placeholder="例如：東京住宿、晚餐" required></label>
                <label>說明<input v-model.trim="expenseForm.detail" maxlength="1000" placeholder="例如：相鐵 Fresa Inn"></label>
                <div class="grid">
                  <label>金額<input v-model="expenseForm.amount" type="number" inputmode="decimal" min="0.01" :step="expenseForm.currency === 'JPY' ? '1' : '0.01'" required></label>
                  <label>幣別<select v-model="expenseForm.currency"><option>JPY</option><option>TWD</option></select></label>
                  <label>付款人<input v-model.trim="expenseForm.paid_by" maxlength="100" required></label>
                  <label>平台<input v-model.trim="expenseForm.platform" maxlength="200" placeholder="Klook／Booking／現場"></label>
                  <label>支付方式<input v-model.trim="expenseForm.payment_method" maxlength="100" placeholder="cube卡／現金／街口"></label>
                  <label>刷卡日期<input v-model="expenseForm.card_date" type="date"></label>
                </div>
                <label>備註<textarea v-model.trim="expenseForm.memo" maxlength="2000" rows="3" placeholder="例如：兩人費用；原價 ¥56,602"></textarea></label>
                <button class="btn" type="submit">{{ busy ? '儲存中…' : editing ? '儲存修改' : '新增支出' }}</button>
                <button v-if="editing" class="btn r" type="button" @click="resetExpenseForm">取消編輯</button>
              </fieldset>
            </form>
          </div>
          <div class="card">
            <h3>支出明細 · {{ expenses.length }} 筆</h3>
            <p class="sub">{{ lastSync ? '上次同步：' + lastSync : '尚未完成同步' }} · 預算頁每 20 秒更新，回到頁面也會更新。離線時無法儲存。</p>
            <div class="grid">
              <label>幣別<select v-model="filterCurrency"><option value="">全部</option><option>JPY</option><option>TWD</option></select></label>
              <label>搜尋<input v-model.trim="searchText" type="search" placeholder="項目、分類、付款人"></label>
            </div>
            <p v-if="!loading && !expenses.length && lastSync" class="sub">目前沒有支出，新增第一筆吧。</p>
            <p v-else-if="expenses.length && !filteredExpenses.length" class="sub">沒有符合的支出。</p>
            <article v-for="e in filteredExpenses" :key="e.id" class="card" style="margin-top:10px">
              <div class="row"><b>{{ e.description }}</b><b>{{ money(e.amount, e.currency) }}</b></div>
              <div class="nt">{{ e.expense_date }} · {{ e.category }} · {{ e.paid_by }} 付款</div>
              <div v-if="readNote(e.note).detail" class="nt">說明：{{ readNote(e.note).detail }}</div>
              <div v-if="readNote(e.note).platform" class="nt">平台：{{ readNote(e.note).platform }}</div>
              <div v-if="readNote(e.note).payment_method" class="nt">支付方式：{{ readNote(e.note).payment_method }}</div>
              <div v-if="readNote(e.note).card_date" class="nt">刷卡日期：{{ readNote(e.note).card_date }}</div>
              <div v-if="readNote(e.note).memo" class="nt">備註：{{ readNote(e.note).memo }}</div>
              <div class="actions">
                <button class="btn r" @click="editExpense(e)" :disabled="busy">編輯</button>
                <button class="btn" @click="deleteExpense(e)" :disabled="busy">刪除</button>
              </div>
            </article>
          </div>
        </template>
      </section>
      <div class="card">
        <h3>已預付（兩人）</h3>
        <div v-for="(row, idx) in budgets" :key="idx" class="row">
          <span>{{ row[0] }}</span><b>{{ row[1] }}</b>
        </div>
        <div class="row"><span>合計</span><b>NT$66,895 ＋ ¥96,578</b></div>
      </div>
      <div class="card">
        <h3>當地每日預估（兩人）</h3>
        <div v-for="(day, idx) in days" :key="idx" style="padding: 4px 0">
          <div class="row" style="border: 0; padding: 0">
            <span>{{ day.d }} {{ day.t }}</span><b>¥{{ day.e.toLocaleString() }}</b>
          </div>
          <div class="bar">
            <i :style="{ width: Math.round(day.e / maxBudget * 100) + '%' }"></i>
          </div>
        </div>
        <div class="row">
          <span>合計（不含伴手禮）</span><b>約 ¥{{ totalBudget.toLocaleString() }}</b>
        </div>
      </div>
    </template>
  </main>
  <!-- 底部導覽列 -->
  <nav>
    <button 
      v-for="(navItem, idx) in navs" 
      :key="idx" 
      :class="{ on: tab === idx }"
      @click="setTab(idx)"
    >
      <b>{{ navItem[0] }}</b>{{ navItem[1] }}
    </button>
  </nav>
</div>
<script>
  const MAPS_BASE = "https://maps.app.goo.gl/";
  const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted } = Vue;
  createApp({
    setup() {
      const tab = ref(0);

      const setCur = (i) => {
        cur.value = i;
        window.scrollTo(0, 0);
      };
      const setTab = (i) => {
        tab.value = i;
        window.scrollTo(0, 0);
      };
      onMounted(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("pk") || "{}");
          Object.assign(pk, saved);
        } catch (e) {
          console.error(e);
        }
      });
      watch(pk, (newPk) => {
        try {
          localStorage.setItem("pk", JSON.stringify(newPk));
        } catch (e) {
          console.error(e);
        }
      }, { deep: true });
      return {
        cloudUser, memberName, memberReady, cloudAvailable, cloudError, cloudStatus, login,
        authBusy, busy, loading, expenses, totals, categories, expenseForm, editing,
        lastSync, filterCurrency, searchText, filteredExpenses, money, readNote,
        signIn, signOut, refreshExpenses, saveExpense, editExpense, deleteExpense, resetExpenseForm,
        tab, cur, pk, days, transports, hotels, packing, budgets, navs,
        currentDayData, totalBudget, maxBudget,
        isHttp, getMapUrl, setCur, setTab
      };
    }
  }).mount('#app');
</script>
</body>
</html>
